<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lincolnway Leaderboard</title>
<style>
  :root{
    --bg:#faf6f0;
    --surface:#ffffff;
    --ink:#1c2434;
    --ink-2:#57606f;
    --ink-3:#8b93a3;
    --line:#ece5da;
    --accent:#1f9d63;
    --accent-2:#52c28d;
    --accent-deep:#157a4b;
    --mint:#8fe0b8;
    --teal:#147d64;
    --teal-soft:#e2f3ee;
    --amber-soft:#fdeeda;
    --gold:#d4a017;
    --silver:#9aa3b2;
    --bronze:#b5763c;
    --shadow:0 1px 2px rgba(28,36,52,.05),0 8px 24px -12px rgba(28,36,52,.18);
    --shadow-lg:0 2px 4px rgba(28,36,52,.06),0 20px 44px -16px rgba(28,36,52,.25);
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 24px 64px}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,14px) scale(1.08)}100%{transform:translate(0,0) scale(1)}}
  @keyframes sheen{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes bounceIn{0%{opacity:0;transform:translateY(30px) scale(.9)}60%{transform:translateY(-6px) scale(1.02)}100%{opacity:1;transform:none}}
  @keyframes crownBob{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-8deg) translateY(-5px)}}
  @keyframes barSheen{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(560%) skewX(-18deg)}}
  @keyframes medalShine{0%,75%{transform:translateX(-140%) rotate(20deg)}100%{transform:translateX(220%) rotate(20deg)}}
  @keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .rise{opacity:0;animation:rise .7s cubic-bezier(.22,.8,.3,1) forwards}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .rise{opacity:1}
  }

  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,#1c2434 0%,#243048 55%,#31292f 100%);
    color:#fdf8f1;border-radius:0 0 32px 32px;text-align:center;
  }
  .hero .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
  .hero .b1{width:420px;height:420px;background:#2fa96f;top:-180px;right:-80px;animation:drift 14s ease-in-out infinite}
  .hero .b2{width:340px;height:340px;background:#52c28d;bottom:-200px;left:-60px;opacity:.35;animation:drift2 18s ease-in-out infinite}
  .hero-inner{position:relative;max-width:980px;margin:0 auto;padding:44px 24px 40px}
  .eyebrow{font-size:.95rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f5c89a}
  h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;
     background:linear-gradient(100deg,#ffffff 30%,#a9e8c6 50%,#ffffff 70%);
     background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
     animation:sheen 6s linear infinite}
  .hero-date{color:#c9cedb;font-size:1rem}
  .team-strip{
    display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap;
  }
  .team-chip{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;
    padding:8px 18px;font-size:.92rem;font-weight:600;
  }
  .team-chip strong{color:var(--mint);font-variant-numeric:tabular-nums}

  /* podium */
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:end;margin-top:-26px;position:relative;z-index:2}
  @media (max-width:640px){.podium{grid-template-columns:1fr;align-items:stretch}}
  .step{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);text-align:center;padding:22px 16px 18px;position:relative;
    opacity:0;animation:bounceIn .7s cubic-bezier(.22,.8,.3,1) forwards;
  }
  .step.first{padding-top:34px;animation-delay:.15s}
  .step.second{animation-delay:.3s}
  .step.third{animation-delay:.45s}
  @media (min-width:641px){
    .step.second{margin-bottom:-14px}
    .step.third{margin-bottom:-24px}
  }
  .step .crown{position:absolute;top:-17px;left:50%;margin-left:-16px;font-size:1.8rem;animation:crownBob 2.6s ease-in-out infinite;display:inline-block}
  .medal{
    width:52px;height:52px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
    font-size:1.35rem;font-weight:800;color:#fff;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .medal::after{
    content:"";position:absolute;top:-20%;left:0;width:45%;height:140%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:medalShine 3.4s ease-in-out infinite;
  }
  .first .medal{background:linear-gradient(135deg,#f0c14b,#d4a017);width:62px;height:62px;font-size:1.6rem}
  .second .medal{background:linear-gradient(135deg,#b8c0cc,#9aa3b2)}
  .third .medal{background:linear-gradient(135deg,#cd9159,#b5763c)}
  .step .s-name{font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
  .first .s-name{font-size:1.2rem}
  .step .s-vol{font-size:1.5rem;font-weight:800;color:var(--accent-deep);font-variant-numeric:tabular-nums;margin-top:2px}
  .first .s-vol{font-size:1.85rem}
  .step .s-units{font-size:.88rem;color:var(--ink-2)}

  /* standings */
  section{margin-top:40px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .sec-head h2{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:10px}
  .icon-chip{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;background:var(--amber-soft)}
  .toggle{display:inline-flex;background:#f1ebe1;border-radius:12px;padding:4px;gap:2px}
  .toggle button{
    border:none;background:transparent;border-radius:9px;padding:7px 16px;font-size:.88rem;font-weight:700;
    color:var(--ink-2);cursor:pointer;transition:all .2s ease;font-family:inherit;
  }
  .toggle button.on{background:#fff;color:var(--accent-deep);box-shadow:var(--shadow)}
  .board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .row{
    display:grid;grid-template-columns:52px 1fr 220px 110px;gap:14px;align-items:center;
    padding:14px 20px;border-bottom:1px solid var(--line);
    transition:background .15s,transform .2s ease;
    opacity:0;animation:rowIn .5s cubic-bezier(.22,.8,.3,1) forwards;
  }
  .row:last-child{border-bottom:none}
  .row:hover{background:#fdfaf5;transform:translateX(4px)}
  @media (max-width:640px){.row{grid-template-columns:44px 1fr 90px}.row .barcell{display:none}}
  .rk{
    width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.95rem;background:#f1ebe1;color:var(--ink-2);
  }
  .rk.r1{background:linear-gradient(135deg,#f0c14b,#d4a017);color:#fff}
  .rk.r2{background:linear-gradient(135deg,#b8c0cc,#9aa3b2);color:#fff}
  .rk.r3{background:linear-gradient(135deg,#cd9159,#b5763c);color:#fff}
  .row .name{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .name .sub{font-size:.82rem;color:var(--ink-3);font-weight:500}
  .barcell .track{height:9px;border-radius:99px;background:#f3ece2;overflow:hidden}
  .barcell .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));width:0;transition:width 1.3s cubic-bezier(.22,.8,.3,1);position:relative;overflow:hidden}
  .barcell .fill::after{content:"";position:absolute;top:0;left:0;height:100%;width:34%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    animation:barSheen 3s ease-in-out infinite}
  .row.r1 .barcell .fill{background:linear-gradient(90deg,#f0c14b,#d4a017)}
  .val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .val .u{display:block;font-size:.78rem;color:var(--ink-3);font-weight:600}

  footer{margin-top:48px;text-align:center;color:var(--ink-3);font-size:.88rem}
  .fresh{display:inline-flex;align-items:center;gap:7px}
  .fresh .dot{width:8px;height:8px;border-radius:50%;background:#0f8a43;box-shadow:0 0 0 3px rgba(15,138,67,.18)}
  /* stale-data warning: shown when generatedAt is more than 36h old */
  .fresh.stale{background:#fff4e5;border:1px solid #f0b357;border-radius:999px;padding:5px 12px 5px 10px}
  .fresh.stale .dot{background:#c8791a;box-shadow:0 0 0 3px rgba(200,121,26,.18);animation:stalePulse 2s ease-in-out infinite}
  .fresh.stale #freshness{color:#8a5310;font-weight:700}
  @keyframes stalePulse{0%,100%{opacity:1}50%{opacity:.45}}
  .note{margin-top:6px;font-size:.82rem}
</style>
</head>

<script>
window.__bootDash = function(){
  const D = window.LB_DATA;
  const $ = id => document.getElementById(id);
  const esc = s => { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; };
  const fmtCompact = n => n >= 1e6 ? "$" + (n/1e6).toFixed(2).replace(/\.?0+$/,"") + "M"
                       : n >= 1e3 ? "$" + Math.round(n/1e3) + "K" : "$" + Math.round(n);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el, target, formatter, dur=1300){
    if (reduceMotion){ el.textContent = formatter(target); return; }
    const t0 = performance.now(), ease = x => 1 - Math.pow(1-x,3);
    (function frame(now){
      const p = Math.min((now-t0)/dur,1);
      el.textContent = formatter(target*ease(p));
      if (p<1) requestAnimationFrame(frame);
    })(t0);
  }

  const today = new Date();
  $("heroDate").textContent = today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const daysLeft = Math.max(0, Math.ceil((new Date(today.getFullYear(),11,31) - today)/86400000));
  countUp($("daysLeft"), daysLeft, n => Math.round(n));
  const totU = D.agents.reduce((s,a)=>s+a.units,0);
  const totV = D.agents.reduce((s,a)=>s+a.volume,0);
  countUp($("teamUnits"), totU, n => Math.round(n));
  countUp($("teamVol"), totV, fmtCompact);

  /* Official ranking is ALWAYS by sales volume; the toggle only changes
     which stat the bars and big numbers show. */
  let metric = "volume";
  const fmtMetric = (a) => metric === "volume" ? fmtCompact(a.volume) : a.units;
  const ranked = () => [...D.agents].sort((a,b)=> b.volume-a.volume || b.units-a.units);

  function renderPodium(){
    const top3 = ranked().slice(0,3);
    const order = ["second","first","third"];         /* visual: 2nd | 1st | 3rd */
    const seq = [top3[1], top3[0], top3[2]];
    $("podium").innerHTML = seq.map((a,i)=>{
      if (!a) return "";
      const cls = order[i];
      const medal = cls==="first" ? "🥇" : cls==="second" ? "🥈" : "🥉";
      return `<div class="step ${cls}">
        ${cls==="first" ? '<span class="crown">👑</span>' : ""}
        <div class="medal">${medal}</div>
        <div class="s-name">${esc(a.name)}</div>
        <div class="s-vol">${metric==="volume" ? fmtCompact(a.volume) : a.units + " units"}</div>
        <div class="s-units">${metric==="volume" ? a.units + " units" : fmtCompact(a.volume) + " volume"}</div>
      </div>`;
    }).join("");
  }

  function renderStandings(){
    const list = ranked();
    const max = Math.max(...list.map(a=>a[metric])) || 1;
    $("standings").innerHTML = list.map((a,i)=>`
      <div class="row r${i+1}" style="animation-delay:${(i*0.07).toFixed(2)}s">
        <div class="rk r${i+1}">${i+1}</div>
        <div class="name">${esc(a.name)}${i===0?' <span class="sub">👑 top spot</span>':""}</div>
        <div class="barcell"><div class="track"><div class="fill" data-w="${(a[metric]/max*100).toFixed(1)}"></div></div></div>
        <div class="val">${fmtMetric(a)}<span class="u">${metric==="volume" ? a.units+" units" : fmtCompact(a.volume)}</span></div>
      </div>`).join("");
    requestAnimationFrame(()=>{ setTimeout(()=>{
      document.querySelectorAll("#standings .fill").forEach(f=>{ f.style.width = f.dataset.w + "%"; });
    }, 60); });
  }

  $("metricToggle").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-m]");
    if (!btn || btn.dataset.m === metric) return;
    metric = btn.dataset.m;
    document.querySelectorAll("#metricToggle button").forEach(b=>b.classList.toggle("on", b===btn));
    renderPodium(); renderStandings();
  });

  renderPodium(); renderStandings();

  const gen = new Date(D.generatedAt);
  const stamp = gen.toLocaleDateString("en-US",{month:"short",day:"numeric"}) +
    " at " + gen.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const ageHrs = (Date.now() - gen.getTime()) / 36e5;
  const freshEl = $("freshness");
  const wrapEl = freshEl.parentElement;
  if (ageHrs > 36) {
    const days = Math.floor(ageHrs / 24);
    const age = days >= 1 ? (days === 1 ? "1 day" : days + " days") : Math.floor(ageHrs) + " hours";
    wrapEl.classList.add("stale");
    freshEl.textContent = "⚠️ These numbers are " + age + " old — last updated " + stamp +
      ". The morning refresh has not run since.";
  } else {
    wrapEl.classList.remove("stale");
    freshEl.textContent = "Fresh data pulled " + stamp;
  }
};
if (window.LB_DATA) window.__bootDash();
</script>

        <input id="gatePin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
        <button id="gateGo">Unlock</button>
        <div class="g-err" id="gateErr"></div>
        <div class="g-note">This device stays unlocked after the first time.</div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const pinEl = () => document.getElementById("gatePin");

  async function keyFromPin(pin){
    const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      mat, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  async function unlockWith(key){
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
    (0,eval)(new TextDecoder().decode(pt));   /* sets the data global */
    window.__bootDash();
    const g = document.getElementById("gateOv");
    g.style.transition = "opacity .5s ease"; g.style.opacity = "0";
    setTimeout(()=> ov.remove(), 550);
    return key;
  }
  async function submit(){
    const pin = pinEl().value.trim();
    if (!pin) return;
    try {
      const key = await keyFromPin(pin);
      await unlockWith(key);
      try {
        const jwk = await crypto.subtle.exportKey("jwk", key);
        localStorage.setItem(LSK, JSON.stringify(jwk));
      } catch(e){}
    } catch(e){
      document.getElementById("gateErr").textContent = "That PIN didn't work — try again.";
      pinEl().value = "";
      ov.querySelector("#gateOv").classList.remove("shake");
      void ov.offsetWidth;
      ov.querySelector("#gateOv").classList.add("shake");
    }
  }
  document.getElementById("gateGo").addEventListener("click", submit);
  pinEl().addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

  /* silent unlock with remembered key */
  (async ()=>{
    try {
      const stored = localStorage.getItem(LSK);
      if (!stored) { pinEl().focus(); return; }
      const key = await crypto.subtle.importKey("jwk", JSON.parse(stored), {name:"AES-GCM"}, true, ["decrypt"]);
      await unlockWith(key);
    } catch(e){ localStorage.removeItem(LSK); pinEl().focus(); }
  })();
})();
</script>
</body>
</html>
